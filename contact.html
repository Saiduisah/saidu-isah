<body>
  <header>
    <nav class="navbar">
      <a class="site-name" href="index.html">
        <img src="images/logo.png" alt="SD logo">

      <div class="nav-links">

        <a href="contact.html" class="active">CONTACT</a>
      </div>

  <main>
    <section class="page-title">
      <h1>Contact Me</h1>
      <p>Feel free to contact me through the form below or my social media accounts.</p>
      <div class="accent-line"></div>
    </section>

    <div class="contact-grid">
      <section class="card">
        <h2>Send a message</h2>
        <form action="#" method="post">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required>

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>

          <label for="message">Your Message</label>
          <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </section>

      <aside class="card">
        <h2>Find me online</h2>
        <p>Prefer a quick chat? Reach me here:</p>
        <div class="contact-links">
          <a href="https://wa.me/2349063900844" target="_blank" rel="noopener">WhatsApp</a>
          <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
          <a href="https://linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
        </div>
      </aside>
    </div>
  </main>
